services:
  django:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
      args:
        - ENVIRONMENT=production
    expose: [ 8000 ]
    networks:
      - proxy
      - default
    volumes:
      - sqlite:/app/data/:rw
      - staticfiles:/app/staticfiles/:rw
      - media:/app/media/:rw
    depends_on:
      - redis
    env_file:
      - .env
    command: /start
    restart: unless-stopped

  redis:
    image: redis:latest
    restart: unless-stopped

volumes:
  sqlite:
  staticfiles:
  media:

networks:
  proxy:
    external: true
